# Mirrors production: the browser sees ONE origin; /api is forwarded to the API container
# (on Vercel this is the /api rewrite in frontend/vercel.json).
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri /index.html;   # single-page app: deep links fall back to index.html
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
}
