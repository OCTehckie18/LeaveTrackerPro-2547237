[project]
name = "leavetracker-api"
version = "0.1.0"
description = "LeaveTrackerPro API - leave requests with a Manager + HOD approval workflow"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.20",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# The formatter owns code line length; long docstrings/comments are tolerated.
ignore = ["E501"]

[tool.ruff.lint.isort]
# ./alembic is our migrations folder, but `alembic` the library is third-party.
known-third-party = ["alembic"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
warn_return_any = false
